<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SmartBYD">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/s/car.png">
<title>SmartBYD</title>
<!--
  The iPhone version of the SmartBYD phone app. It copies the app's design one-to-one: the same
  colours, font (Vazirmatn, served by the car), card shapes, icons (Material + the SmartBYD fan),
  layout and the floating tab bar. App texts come from the app itself (/s/strings-<lang>.json),
  so the wording always matches what Saad confirmed; only web-only texts live below in T.
-->
<style>
  @font-face { font-family: "Vazirmatn"; src: url(/s/font-regular.ttf) format("truetype"); font-weight: 400 500; font-display: swap; }
  @font-face { font-family: "Vazirmatn"; src: url(/s/font-bold.ttf) format("truetype"); font-weight: 600 700; font-display: swap; }
  :root {
    --primary: #1F4FD8; --on-primary: #FFFFFF; --primary-container: #DEE6FB; --on-primary-container: #1F4FD8;
    --bg: #F2F4F7; --surface: #FFFFFF; --ink: #070B14; --surface-variant: #E4E9F2; --muted: #6B7686;
    --outline: #D3DAE6; --error: #D1435B; --success: #1E9E6A; --cool: #2F7DE1; --warm: #E0603A;
    --shadow: 0 10px 30px rgba(7, 11, 20, .14), 0 2px 6px rgba(7, 11, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #3B63DE; --primary-container: #1B2A55; --on-primary-container: #CBD7FA;
      --bg: #0B0F17; --surface: #141A26; --ink: #EAEEF6; --surface-variant: #232B3A; --muted: #9AA6B8;
      --outline: #2C3546; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
  .page { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
          padding: calc(20px + env(safe-area-inset-top)) 20px calc(116px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  .dash-page { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 9; -webkit-overflow-scrolling: touch; }
  .search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--outline);
            background: var(--surface); color: var(--ink); outline: none; }
  .dash-h { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; color: var(--muted); padding: 8px 6px 0; }
  .dash-h i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .light { display: block; width: 100%; text-align: start; padding: 12px 14px; }
  .light + .light { border-top: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); }
  .light .top { display: flex; align-items: center; gap: 14px; }
  .light .tile { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none;
                 position: relative; padding: 0; }
  .light .tile svg { width: 38px; height: 38px; }
  .light .tile .t { font-weight: 800; direction: ltr; }
  .light .txt b { display: block; font-size: 16px; font-weight: 600; }
  .light .txt small { display: block; font-size: 14px; color: var(--muted); }
  .light .todo { margin: 10px 0 0 68px; padding: 12px; border-radius: 14px; font-size: 15px; }
  [dir=rtl] .light .todo { margin: 10px 68px 0 0; }
  .light .todo b { display: block; font-size: 14px; }
  a.list-row { color: inherit; text-decoration: none; }
  svg.i.chev { color: var(--muted); width: 22px; height: 22px; }
  [dir=rtl] svg.i.chev, [dir=rtl] svg.i.flip { transform: scaleX(-1); }
  .scrim { position: fixed; inset: 0; background: rgba(7, 11, 20, .45); z-index: 10; display: flex; align-items: center;
           justify-content: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet { background: var(--surface); border-radius: 28px; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto;
           padding: 22px 0; -webkit-overflow-scrolling: touch; }
  .about-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 22px 10px; }
  .about-head img { width: 76px; height: 76px; border-radius: 50%; margin-bottom: 6px; }
  .sheet .list-row { padding: 10px 22px; }
  .warn { display: flex; gap: 10px; margin: 12px 22px 0; padding: 14px; border-radius: 18px; background: rgba(178, 106, 0, .10);
          font-size: 14px; }
  .warn svg.i { color: #B26A00; width: 20px; height: 20px; }
  .legal-head { display: flex; align-items: center; gap: 6px; padding: 0 22px 6px 10px; }
  .legal { padding: 0 22px; }
  .legal h3 { font-size: 16px; font-weight: 600; margin: 16px 0 4px; }
  .legal p { margin: 0; font-size: 15px; color: var(--muted); }

  /* type scale (same sizes as the app) */
  .h-small { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 0; }
  .h-medium { font-size: 32px; font-weight: 700; line-height: 1.15; }
  .t-medium { font-size: 19px; font-weight: 600; }
  .t-small { font-size: 16px; font-weight: 600; }
  .b-small { font-size: 14px; color: var(--muted); }
  .l-large { font-size: 17px; font-weight: 600; }
  .l-small { font-size: 12px; font-weight: 500; }

  /* header + status line */
  .status { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--success); } .dot.bad { background: var(--error); }
  .car { width: 100%; height: 180px; object-fit: contain; display: block; }

  /* cards */
  .card { background: var(--surface); border-radius: 24px; padding: 18px; }
  .card.flush { padding: 0; overflow: hidden; }
  .card-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .card-title svg.i { width: 20px; height: 20px; color: var(--primary); }
  .section { font-size: 17px; font-weight: 600; color: var(--muted); padding: 6px 6px 0; }

  /* round buttons */
  .round { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
           border: 1px solid var(--outline); background: var(--surface); color: var(--primary); flex: none; }
  .round svg.i { width: 25px; height: 25px; }
  .round.filled { background: var(--primary); border-color: var(--primary); color: #fff; }
  .round.cool { color: var(--cool); } .round.warm { color: var(--warm); }
  .labeled { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .labeled .round { width: 60px; height: 60px; } .labeled .round svg.i { width: 27px; height: 27px; }
  .labeled.compact { flex: none; width: 76px; } .labeled.compact .round { width: 56px; height: 56px; }
  .labeled > span:last-child { font-size: 12px; font-weight: 500; color: var(--muted); text-align: center;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row { display: flex; align-items: center; }
  .spread { display: flex; justify-content: space-between; gap: 6px; }
  button.round:active, .labeled:active .round, .tile:active, .pill:active, .fan-key:active { transform: scale(.96); }

  /* A/C card */
  .ac { display: flex; align-items: center; gap: 12px; }
  .ac .info { flex: 1; min-width: 0; }
  .ac .value.on { color: var(--primary); }

  /* voice (Siri) card */
  .voice { display: flex; align-items: center; gap: 16px; }
  .voice .info { flex: 1; }
  .mic { width: 72px; height: 72px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .mic svg.i { width: 34px; height: 34px; }

  /* fan levels: fan icon in a circle, level as a small badge on the top-end edge */
  .fans { display: flex; gap: 6px; padding-top: 6px; }
  .fan-slot { flex: 1; display: flex; justify-content: center; }
  .fan-key { position: relative; width: 100%; max-width: 56px; aspect-ratio: 1; border-radius: 50%;
             border: 1px solid var(--outline); display: flex; align-items: center; justify-content: center; color: var(--primary); }
  .fan-key svg.i { width: var(--s); height: auto; aspect-ratio: 1; }
  .fan-key b { position: absolute; top: -4px; inset-inline-end: -2px; background: var(--primary); color: var(--on-primary);
               font-size: 12px; font-weight: 700; line-height: 1.35; padding: 0 5px; border-radius: 999px; }

  /* pills (Min / Max) */
  .pills { display: flex; gap: 8px; margin-top: 10px; }
  .pill { flex: 1; height: 44px; border-radius: 999px; background: var(--surface-variant); display: flex; align-items: center;
          justify-content: center; gap: 6px; padding: 0 12px; font-size: 17px; font-weight: 600; }
  .pill svg.i { width: 18px; height: 18px; color: var(--primary); }

  /* car controls: a row per part, its two sides as pills; a press arms the pill, a second press sends it */
  .cc-group { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 16px 2px 2px; }
  .cc-group:first-of-type { margin-top: 4px; }
  .cc-row { padding: 10px 0; border-bottom: 1px solid var(--surface-variant); }
  .cc-row:last-child { border-bottom: 0; }
  .cc-name { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  .cc-name svg.i { width: 20px; height: 20px; color: var(--primary); }
  .cc .pills { margin-top: 8px; }
  .pills.wrap { flex-wrap: wrap; }
  .pills.wrap .pill { flex: 1 0 28%; }
  .cc .pill { font-size: 16px; color: var(--primary); }
  .cc .pill.arm { background: var(--primary); color: var(--on-primary); }
  .cc-hint { font-size: 13px; color: var(--muted); margin: 0 2px 4px; }

  /* temperature stepper */
  .stepper { display: flex; align-items: center; }
  .stepper .value { flex: 1; text-align: center; font-size: 32px; font-weight: 700; color: var(--muted); }
  .stepper .value.up { color: var(--warm); } .stepper .value.down { color: var(--cool); }

  /* tiles */
  .tiles { display: flex; gap: 12px; }
  .tile { flex: 1; background: var(--surface); border-radius: 20px; padding: 18px 12px; display: flex; flex-direction: column;
          align-items: center; gap: 8px; color: var(--ink); }
  .tile svg.i { width: 28px; height: 28px; color: var(--primary); }
  .tile span { font-size: 17px; font-weight: 600; text-align: center; }

  /* list rows (Siri, Settings) */
  .list-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 64px; width: 100%; text-align: start; }
  .list-row + .list-row { border-top: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); }
  .badge { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none;
           background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
  .badge svg.i { width: 22px; height: 22px; }
  .badge.danger { background: color-mix(in srgb, var(--error) 12%, transparent); color: var(--error); }
  .list-row .txt { flex: 1; min-width: 0; }
  .list-row .txt b { display: block; font-size: 16px; font-weight: 600; }
  .list-row .txt small { display: block; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }

  /* segmented picker */
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-variant); }
  .seg button { flex: 1; min-height: 40px; border-radius: 12px; font-size: 17px; font-weight: 600; padding: 6px; }
  .seg button.on { background: var(--primary); color: var(--on-primary); }

  /* pairing */
  .code { width: 100%; font: inherit; font-size: 30px; font-weight: 700; letter-spacing: 10px; text-align: center; direction: ltr;
          padding: 14px; border-radius: 16px; border: 1px solid var(--outline); background: var(--bg); color: var(--ink); outline: none; }
  .code:focus { border-color: var(--primary); }
  .primary-btn { width: 100%; height: 52px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
                 font-size: 17px; font-weight: 600; margin-top: 14px; }
  ol { margin: 0; padding-inline-start: 22px; } ol li { margin-bottom: 6px; font-size: 15px; }

  /* floating tab bar (same as the app) */
  .tabbar { position: fixed; left: 20px; right: 20px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto;
            background: var(--surface); border-radius: 32px; box-shadow: var(--shadow); padding: 8px; display: flex;
            justify-content: space-evenly; align-items: center; height: 72px; z-index: 5; }
  .tabbar button { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; border-radius: 28px;
                   color: var(--muted); transition: background-color .2s, padding .2s; }
  .tabbar button span { display: none; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .tabbar button.on { background: var(--primary); color: var(--on-primary); padding: 0 18px; }
  .tabbar button.on span { display: inline; }

  /* result banner, above the tab bar */
  #toast { position: fixed; left: 20px; right: 20px; max-width: 480px; margin: 0 auto; bottom: calc(100px + env(safe-area-inset-bottom));
           display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #1F2A44; color: #fff;
           font-weight: 600; font-size: 15px; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
           pointer-events: none; z-index: 6; }
  #toast.show { opacity: 1; transform: none; }
  #toast svg.i { width: 22px; height: 22px; }
  #toast .ok { color: #34C77B; } #toast .fail { color: #FF6B6B; }
  body.busy .act { pointer-events: none; opacity: .55; }

  /* share board */
  .composer textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--outline);
                       background: var(--bg); color: var(--ink); outline: none; resize: none; min-height: 72px; }
  .composer textarea:focus { border-color: var(--primary); }
  .composer .bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .soft-btn, .send-btn { height: 48px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 20px;
                         font-size: 17px; font-weight: 600; }
  .soft-btn { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
  .send-btn { background: var(--primary); color: var(--on-primary); margin-inline-start: auto; }
  .soft-btn svg.i, .send-btn svg.i { width: 20px; height: 20px; }
  .progress { height: 6px; border-radius: 3px; background: var(--surface-variant); overflow: hidden; margin-top: 10px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }
  .share-row .txt b { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .share-row .acts { display: flex; gap: 6px; flex: none; }
  .share-row .acts .icon-btn { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
  .share-row .acts .icon-btn.danger { background: color-mix(in srgb, var(--error) 12%, transparent); color: var(--error); }
  .share-row .acts svg.i { width: 20px; height: 20px; }
  .badge.car { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .empty { text-align: center; padding: 28px 24px; }
  .empty svg.i { width: 48px; height: 48px; color: var(--primary); margin: 0 auto 8px; }
  .tabbar button { position: relative; }
  .tabbar button .new { position: absolute; top: 12px; inset-inline-end: 10px; width: 9px; height: 9px; border-radius: 50%;
                        background: var(--error); display: none; }
  .tabbar button.has-new .new { display: block; }
  .sheet.confirm { padding: 22px; }
  .confirm .bar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
</style>
</head>
<body>

<!-- ============ Pairing (first time on this iPhone) ============ -->
<main id="pairPage" class="page hidden">
  <div>
    <h1 class="h-small" data-car>SmartBYD</h1>
    <div class="status"><span class="dot" data-dot></span><span data-state></span></div>
  </div>
  <img class="car" src="/s/car.png" alt="">
  <section class="card">
    <div class="card-title"><svg class="i" data-icon="link_off"></svg><span data-t="pairTitle"></span></div>
    <p class="b-small" style="margin:0 0 14px" data-t="pairHint"></p>
    <input id="code" class="code" type="tel" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="••••••">
    <button class="primary-btn" id="pairBtn" data-t="pair"></button>
  </section>
  <div class="section" data-s="language"></div>
  <div class="seg" data-lang-picker></div>
  <section class="card flush">
    <button class="list-row" data-about>
      <span class="badge"><svg class="i" data-icon="info"></svg></span>
      <span class="txt"><b data-s="aboutTitle"></b><small data-s="aboutMadeBy"></small></span>
      <svg class="i chev" data-icon="chevron_right"></svg>
    </button>
  </section>
</main>

<!-- ============ Home ============ -->
<main id="homePage" class="page hidden">
  <div>
    <h1 class="h-small" data-car>SmartBYD</h1>
    <div class="status"><span class="dot" data-dot></span><span data-state></span></div>
  </div>
  <img class="car" src="/s/car.png" alt="">

  <!-- live A/C state, as last read by the car -->
  <section class="card ac">
    <div class="info">
      <div class="t-small" style="color:var(--muted)" data-s="acTitle"></div>
      <div class="h-medium value" id="acValue">—</div>
      <div class="b-small" id="acUpdated"></div>
    </div>
    <div id="acActions" class="row" style="gap:12px;align-items:flex-start"></div>
  </section>

  <!-- voice: on iPhone that's Siri -->
  <section class="card voice">
    <div class="info">
      <div class="t-medium">Siri</div>
      <div class="b-small" data-t="siriTitle"></div>
    </div>
    <button class="mic" id="toSiri" aria-label="Siri"><svg class="i" data-icon="mic"></svg></button>
  </section>

  <div class="spread" id="quick"></div>

  <section class="card">
    <div class="card-title"><svg class="i" data-icon="fan"></svg><span data-s="fanLevel"></span></div>
    <div class="fans" id="fans"></div>
    <div class="pills" id="fanPills"></div>
  </section>

  <section class="card">
    <div class="card-title"><svg class="i" data-icon="thermostat"></svg><span data-s="temp"></span></div>
    <div class="stepper">
      <button class="round cool" id="tDown" aria-label="−"><svg class="i" data-icon="remove"></svg></button>
      <div class="value" id="tValue">0</div>
      <button class="round warm" id="tUp" aria-label="+"><svg class="i" data-icon="add"></svg></button>
    </div>
    <div class="pills" id="tempPills"></div>
  </section>

  <div class="tiles" id="tiles"></div>

  <!-- doors, windows, sunroof, lights, drive mode: only when the car says its head unit takes them (DiLink 3 / 5 / 5.1 / 100) -->
  <section class="card cc hidden" id="carControls"></section>
</main>

<!-- ============ Share board (messages and files with the car) ============ -->
<main id="sharePage" class="page hidden">
  <h1 class="h-small" data-s="shareTitle"></h1>
  <section class="card composer">
    <textarea id="shareText" rows="2" maxlength="4000"></textarea>
    <div class="bar">
      <label class="soft-btn" for="shareFiles"><svg class="i" data-icon="attach_file"></svg><span data-s="shareFile"></span></label>
      <input id="shareFiles" type="file" multiple hidden>
      <button class="send-btn" id="shareSend"><svg class="i flip" data-icon="send"></svg><span data-s="shareSend"></span></button>
    </div>
    <div id="shareUp" class="hidden">
      <div class="b-small" id="shareUpName" style="margin-top:12px"></div>
      <div class="progress"><i id="shareUpBar"></i></div>
    </div>
  </section>
  <section class="card flush hidden" id="shareList"></section>
  <div class="empty hidden" id="shareEmpty">
    <svg class="i" data-icon="share"></svg>
    <div class="t-medium" data-s="shareEmpty"></div>
    <div class="b-small" data-s="shareEmptyHint"></div>
  </div>
</main>

<!-- ============ Siri ============ -->
<main id="siriPage" class="page hidden">
  <h1 class="h-small" data-t="siriTitle"></h1>
  <section class="card"><ol id="siriSteps"></ol><p class="b-small" style="margin:10px 0 0" data-t="siriNote"></p></section>
  <section class="card flush" id="siriList"></section>
</main>

<!-- ============ Settings ============ -->
<main id="settingsPage" class="page hidden">
  <h1 class="h-small" data-s="settings"></h1>
  <div class="section" data-s="language"></div>
  <div class="seg" data-lang-picker></div>
  <div class="section" data-s="carLink"></div>
  <section class="card flush">
    <div class="list-row">
      <span class="badge"><svg class="i" data-icon="directions_car"></svg></span>
      <span class="txt"><b data-car>SmartBYD</b><small><span data-state></span></small></span>
      <span class="dot" data-dot></span>
    </div>
    <button class="list-row" id="forget">
      <span class="badge danger"><svg class="i" data-icon="logout"></svg></span>
      <span class="txt"><b style="color:var(--error)" data-t="forget"></b></span>
    </button>
  </section>
  <section class="card flush">

  shareTitle: "Share", shareEmpty: "Nothing shared yet", shareTypeHint: "Type a message or paste a link", shareSend: "Send",

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
let lang = localStorage.getItem("smartbyd_lang") || ((navigator.language || "").startsWith("en") ? "en" : "ar");
if (!T[lang]) lang = "ar";
let key = localStorage.getItem("smartbyd_key");
let S = S_FALLBACK;
let tabNow = "home";
let state = { ok: null, name: null, ac: null, acAt: null, cc: localStorage.getItem("smartbyd_cc") === "1" };
const t = k => (T[lang] || T.en)[k] ?? T.en[k];
const s = k => S[k] ?? S_FALLBACK[k] ?? "";
const cmdLabel = c => (S.cmd && S.cmd[c]) || c;

function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>"; }
function paintIcons(root) {
  (root || document).querySelectorAll("svg[data-icon]").forEach(el => {
    el.setAttribute("viewBox", "0 0 24 24"); el.setAttribute("aria-hidden", "true"); el.innerHTML = ICONS[el.dataset.icon] || "";
  });
}
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function esc(x) { return String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// ---------- texts ----------
async function loadStrings() {
  try {
    const r = await fetch("/s/strings-" + lang + ".json?v=7");
    if (r.ok) S = await r.json();
  } catch (e) {}
}

async function setLang(l) {
  lang = l; localStorage.setItem("smartbyd_lang", l);
  await loadStrings(); render();
}

// ---------- rendering ----------
function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  $$("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  $$("[data-s]").forEach(e => e.textContent = s(e.dataset.s));
  $$("[data-lang-picker]").forEach(p => {
    p.innerHTML = LANGS.map(([code, name]) => '<button data-l="' + code + '" class="' + (code === lang ? "on" : "") + '">' + name + "</button>").join("");
    p.querySelectorAll("button").forEach(b => b.onclick = () => setLang(b.dataset.l));
  });
  renderQuick(); renderFans(); renderTemp(); renderTiles(); renderCarControls(); renderSiri(); renderState(); renderShare();
  $("shareText").placeholder = s("shareTypeHint");
  if (DASH) renderDash();
  paintIcons();
}

function labeled(cmd, compact) {
  return '<button class="labeled act' + (compact ? " compact" : "") + '" data-cmd="' + cmd + '"><span class="round">' + icon(CMD_ICON[cmd]) + "</span><span>" + esc(cmdLabel(cmd)) + "</span></button>";
}
function pill(cmd, text) { return '<button class="pill act" data-cmd="' + cmd + '">' + icon(CMD_ICON[cmd]) + "<span>" + esc(text) + "</span></button>"; }
function wire(root) { root.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => send(b.dataset.cmd, +(b.dataset.n || 1))); }

/** The comfort rows this car has: its equipment, and the back seats too for a back-seat row; "all" shows once. */
function comfortRows() {
  const has = new Set((state.eq || "").split(",").filter(Boolean));
  const out = [];
  CC_COMFORT.forEach(r => {
    const [item, rear, , title] = r;
    if (!has.has(item) || (rear && !has.has("REAR_SEATS"))) return;
    if (title === "cc_row_all_seats" && out.some(o => o[3] === title)) return;
    out.push(r);
  });
  // With heat and ventilation both, one "all seats" row with the three keys.
  const all = out.find(o => o[3] === "cc_row_all_seats");
  if (all && has.has("SEAT_HEAT") && has.has("SEAT_VENT"))
    all[5] = [["CARCTL_SEATS_HEAT_ALL", "cc_all_heat"], ["CARCTL_SEATS_VENT_ALL", "cc_all_vent"], ["CARCTL_SEATS_ALL_OFF", "cc_all_off"]];
  return out;
}

let ccShown = null;  // what the card was last built for (language + words), so the car's regular check doesn't rebuild it mid-tap
function renderCarControls() {
  const box = $("carControls");
  box.classList.toggle("hidden", !state.cc);
  if (!state.cc) { box.innerHTML = ""; ccShown = null; return; }
  const sig = lang + "|" + s("cc_title") + "|" + t("ccHint") + "|" + (state.eq || "");
  if (ccShown === sig) return;
  ccShown = sig;
  const p = ([cmd, word]) => '<button class="pill" data-cc="' + cmd + '" data-w="' + esc(s(word)) + '">' + esc(s(word)) + "</button>";
  let h = '<div class="card-title"><svg class="i" data-icon="directions_car"></svg><span>' + esc(s("cc_title")) + "</span></div>" +
    '<div class="cc-hint">' + esc(t("ccHint")) + "</div>";
  CC.forEach(([group, rows]) => {
    h += '<div class="cc-group">' + esc(s(group)) + "</div>";
    rows.forEach(([title, ic, a, b]) => {
      h += '<div class="cc-row"><div class="cc-name">' + icon(ic) + "<span>" + esc(s(title)) + '</span></div><div class="pills">' + p(a) + p(b) + "</div></div>";
    });
  });
  h += '<div class="cc-group">' + esc(s("cc_group_drive")) + '</div><div class="pills">' + CC_MODES.map(p).join("") + "</div>";
  let lastGroup = null;
  comfortRows().forEach(([, , group, title, ic, keys]) => {
    if (group !== lastGroup) { h += '<div class="cc-group">' + esc(s(group)) + "</div>"; lastGroup = group; }
    h += '<div class="cc-row"><div class="cc-name">' + icon(ic) + "<span>" + esc(s(title)) + '</span></div><div class="pills wrap">' +
      keys.map(p).join("") + "</div></div>";
  });
  box.innerHTML = h;
  paintIcons(box);
  // A stray tap must never move a door or a window: the first press arms the pill for 3 s, the second sends it.
  let armed = null, timer = null;
  const disarm = () => { if (armed) { armed.classList.remove("arm"); armed.textContent = armed.dataset.w; } armed = null; clearTimeout(timer); };
  box.querySelectorAll("[data-cc]").forEach(b => b.onclick = () => {
    if (armed === b) { disarm(); send(b.dataset.cc, 1); return; }
    disarm();
    armed = b; b.classList.add("arm"); b.textContent = t("ccAgain");
    timer = setTimeout(disarm, 3000);
  });
}

function renderState() {
  const name = (state.name || "SmartBYD").replace(/^SmartBYD\s+/, "") || "SmartBYD";
  $$("[data-car]").forEach(e => e.textContent = name);
  $$("[data-dot]").forEach(e => e.className = "dot" + (state.ok === true ? " ok" : state.ok === false ? " bad" : ""));
  $$("[data-state]").forEach(e => e.textContent = state.ok === false ? s("lost") : state.ok ? s("connected") : "");
  // A/C: only what the car read; unknown shows both buttons, never a guess.
  const v = $("acValue");
  v.textContent = state.ac === true ? s("on") : state.ac === false ? s("off") : "—";
  v.classList.toggle("on", state.ac === true);
  $("acUpdated").textContent = state.acAt
    ? s("acUpdated").replace("{t}", new Date(state.acAt).toLocaleTimeString(lang === "ckb" ? "ckb-IQ" : lang, { hour: "numeric", minute: "2-digit" }))
    : "";
  const a = $("acActions");
  if (state.ac === true) a.innerHTML = '<button class="round filled act" data-cmd="AC_OFF" aria-label="' + esc(cmdLabel("AC_OFF")) + '">' + icon("power_settings_new") + "</button>";
  else if (state.ac === false) a.innerHTML = '<button class="round act" data-cmd="AC_ON" aria-label="' + esc(cmdLabel("AC_ON")) + '">' + icon("power_settings_new") + "</button>";
  else a.innerHTML = labeled("AC_ON", true) + labeled("AC_OFF", true);
  wire(a);
}

function renderSiri() {
  $("siriSteps").innerHTML = t("siriSteps").map(x => "<li>" + esc(x) + "</li>").join("");
  if (!key) { $("siriList").innerHTML = ""; return; }
  $("siriList").innerHTML = SIRI.map(([cmd, amount, ar, en], i) =>
    '<div class="list-row"><span class="badge">' + icon(CMD_ICON[cmd]) + '</span><span class="txt"><b>“' + esc(lang === "en" ? en : ar) +

// ---------- talking to the car ----------
async function info() {
  try {
    const r = await fetch("/api/info", { cache: "no-store" });
    const j = await r.json();
    state = { ok: true, name: j.name, ac: j.ac ?? null, acAt: j.acAt ?? null, cc: "carControls" in j ? j.carControls === true : state.cc,
      eq: "equipment" in j ? j.equipment : state.eq };
    localStorage.setItem("smartbyd_cc", state.cc ? "1" : "0");
  } catch (e) { state.ok = false; }
  renderState(); paintIcons($("acActions")); renderCarControls();
}

let busy = false;
async function send(cmd, amount) {
  if (busy) return;
  busy = true; document.body.classList.add("busy");
  const label = cmd === "FAN_LEVEL" ? s("fanLevel") + " " + amount : cmdLabel(cmd);
  toast(t("sending") + "  " + label, true);
  try {
    const r = await fetch("/api/command", { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ cmd: cmd, amount: amount }) });
    if (r.status === 401) { forget(); return; }
    const j = await r.json();
    if ("ac" in j) { state.ac = j.ac; state.acAt = j.acAt; }
    if ("carControls" in j && j.carControls !== state.cc) { state.cc = j.carControls === true; localStorage.setItem("smartbyd_cc", state.cc ? "1" : "0"); renderCarControls(); }
    if ("equipment" in j && j.equipment !== state.eq) { state.eq = j.equipment; renderCarControls(); }
    state.ok = true; renderState();
    toast((j.ok ? "✓ " : "✕ ") + (j.message || label));
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) { state.ok = false; renderState(); toast("✕ " + t("notReach")); }
  finally { busy = false; document.body.classList.remove("busy"); }
}

// Temperature taps add up for a moment and go as one command ("+3"), like the app.
let pending = 0, pendingTimer = null;
function nudge(d) {
  pending = Math.max(-5, Math.min(5, pending + d));
  const v = $("tValue");
  v.textContent = pending === 0 ? "0" : (pending > 0 ? "+" + pending : "−" + -pending);
  v.className = "value" + (pending > 0 ? " up" : pending < 0 ? " down" : "");
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(async function fire() {
    if (busy) { pendingTimer = setTimeout(fire, 100); return; }
    const n = pending; pending = 0; v.textContent = "0"; v.className = "value";
    if (n !== 0) await send(n > 0 ? "TEMP_UP" : "TEMP_DOWN", Math.abs(n));
  }, 900);
}

async function pair() {
  // Arabic / Kurdish keyboards type ٣٣٢ or ۳۳۲: turn them into 332 first.
  const code = Array.from($("code").value).map(ch => {
    const c = ch.charCodeAt(0);
    if (c >= 0x660 && c <= 0x669) return String(c - 0x660);
    if (c >= 0x6F0 && c <= 0x6F9) return String(c - 0x6F0);
    return ch;
  }).join("").replace(/\D/g, "");
  if (code.length !== 6) { toast("✕ " + t("INCOMPLETE")); return; }
  const ua = navigator.userAgent;
  const device = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android browser" : "Browser";
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, device: device }) });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      toast("✕ " + (t(j.reason) || t("wrongCode")).replace("{n}", j.triesLeft));
      return;
    }
    const j = await r.json(); key = j.key; localStorage.setItem("smartbyd_key", key);
    $("code").value = ""; toast(t("paired")); renderSiri(); paintIcons($("siriList")); showTab("home");
  } catch (e) { toast("✕ " + t("notReach")); }
}

function forget() { localStorage.removeItem("smartbyd_key"); key = null; renderSiri(); showTab("home"); }

// navigator.clipboard needs HTTPS; this page is plain HTTP on the hotspot, so use the old way.
function copy(text) {
  const a = document.createElement("textarea"); a.value = text; a.setAttribute("readonly", "");
  a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a);
  a.select(); a.setSelectionRange(0, text.length);
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(a);
}

// Results carry a mark (✓ done / ✕ failed) that becomes an icon, never a symbol on screen.
let toastTimer;
function toast(msg, sticky) {
  const m = /[✓✕✗]/.exec(msg);
  const kind = m ? (m[0] === "✓" ? "ok" : "fail") : null;
  const text = m ? (msg.slice(0, m.index) + msg.slice(m.index + 1)).trim() : msg;
  const box = $("toast");
  box.innerHTML = (kind ? '<span class="' + kind + '">' + icon(kind === "ok" ? "check_circle" : "error") + "</span>" : "") + "<span></span>";
  box.lastChild.textContent = text;
  box.classList.add("show");
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => box.classList.remove("show"), 2600);
}

// ---------- Share board ----------
// The car keeps one board of messages and files for every paired phone and the car itself.
let share = { rev: null, items: [], max: 500 * 1024 * 1024 }, delId = null, uploading = false;
const SEEN = "smartbyd_share_seen";

function sizeText(n) {
  return n >= 1073741824 ? (n / 1073741824).toFixed(1) + " GB" : n >= 1048576 ? (n / 1048576).toFixed(1) + " MB"
    : n >= 1024 ? Math.floor(n / 1024) + " KB" : n + " B";
}
function whenText(ms) {
  const loc = (lang === "ckb" ? "ckb-IQ" : lang) + "-u-nu-latn", d = new Date(ms), now = new Date();
  const time = d.toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? time : d.toLocaleDateString(loc, { day: "numeric", month: "short" }) + " " + time;
}
function itemIcon(x) {
  if (x.name == null) return /https?:\/\//.test(x.text || "") ? "link" : "notes";
  const t = x.type || "";
  return t.startsWith("image/") ? "image" : t.startsWith("video/") ? "movie" : "file";
}
function fileUrl(x) { return "/api/share/file?id=" + encodeURIComponent(x.id) + "&key=" + encodeURIComponent(key); }

function renderShare() {
  const list = $("shareList");
  $("shareEmpty").classList.toggle("hidden", share.rev === null || share.items.length > 0);
  list.classList.toggle("hidden", share.items.length === 0);
  list.innerHTML = share.items.map((x, i) => {
    const who = x.car ? s("shareCar") : x.mine ? s("shareYou") : x.from;
    // Each part on its own (<bdi>), so "2.3 MB" and "8:29 PM" stay readable in Arabic and Kurdish.
    const meta = [who, whenText(x.at)].concat(x.name != null ? [sizeText(x.size)] : []).map(m => "<bdi>" + esc(m) + "</bdi>").join(" · ");
    const title = x.name != null ? x.name : x.text;
    // Files open in Safari (save or share from there); links open; other text is copied.
    const link = x.name == null ? ((x.text || "").match(/https?:\/\/\S+/) || [null])[0] : null;
    const href = x.name != null ? fileUrl(x) : link;
    const main = '<span class="badge' + (x.car ? " car" : "") + '">' + icon(itemIcon(x)) + '</span><span class="txt"><b>' + esc(title) +
      "</b><small>" + meta + "</small></span>";
    return '<div class="list-row share-row">' +
      (href ? '<a class="row" style="flex:1;min-width:0;gap:14px;color:inherit;text-decoration:none" target="_blank" rel="noopener" href="' + esc(href) + '">' + main + "</a>"
            : '<button class="row" style="flex:1;min-width:0;gap:14px;text-align:start" data-copy="' + i + '">' + main + "</button>") +
      '<span class="acts">' + (x.name == null ? '<button class="icon-btn" data-copy="' + i + '" aria-label="' + esc(s("shareCopied")) + '">' + icon("content_copy") + "</button>" : "") +
      '<button class="icon-btn danger" data-del="' + i + '" aria-label="' + esc(s("shareDelete")) + '">' + icon("delete") + "</button></span></div>";
  }).join("");
  list.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { copy(share.items[+b.dataset.copy].text || ""); toast("✓ " + s("shareCopied")); });
  list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => askDelete(share.items[+b.dataset.del]));
  const seen = +(localStorage.getItem(SEEN) || 0);
  const fresh = share.items.some(x => !x.mine && x.at > seen);
  $$('[data-tab="share"]').forEach(b => b.classList.toggle("has-new", fresh && tabNow !== "share"));
}

function markSeen() {
  const newest = share.items.reduce((m, x) => Math.max(m, x.at), 0);
  if (newest) localStorage.setItem(SEEN, String(newest));
  renderShare();
}

async function loadShare() {
  if (!key) return;
  try {
    const r = await fetch("/api/share" + (share.rev !== null ? "?rev=" + share.rev : ""), { cache: "no-store", headers: { "Authorization": "Bearer " + key } });
    if (r.status === 401) { forget(); return; }
    if (!r.ok) return;
    const j = await r.json();
    share.max = j.max || share.max;
    const changed = Array.isArray(j.items);
    if (changed) share.items = j.items;
    share.rev = j.rev;
    if (changed || share.items.length === 0) { renderShare(); if (tabNow === "share") markSeen(); }
  } catch (e) {}
}

async function sendShareText() {
  const box = $("shareText"), text = box.value.trim();
  if (!text || uploading) return;
  try {
    const r = await fetch("/api/share/text", { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key }, body: JSON.stringify({ text: text }) });
    if (r.status === 401) { forget(); return; }
    if (!r.ok) throw 0;
    box.value = ""; await loadShare(); markSeen();
  } catch (e) { toast("✕ " + s("shareFailed")); }
}

// XHR, not fetch: it reports upload progress.
function uploadOne(file) {
  return new Promise(done => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/share/file?name=" + encodeURIComponent(file.name));
    x.setRequestHeader("Authorization", "Bearer " + key);
    x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    x.upload.onprogress = e => { if (e.lengthComputable) $("shareUpBar").style.width = Math.round(100 * e.loaded / e.total) + "%"; };
    x.onload = () => done(x.status);
    x.onerror = () => done(0);
    x.send(file);
  });
}

async function sendShareFiles(files) {
  if (uploading || !files.length) return;
  uploading = true;
  for (const f of files) {
    if (f.size > share.max) { toast("✕ " + s("shareTooBig").replace("{t}", sizeText(share.max))); break; }
    $("shareUp").classList.remove("hidden"); $("shareUpBar").style.width = "0";
    $("shareUpName").textContent = s("shareSending").replace("{t}", f.name);
    const status = await uploadOne(f);
    if (status === 401) { forget(); break; }
    if (status !== 200) {
      toast("✕ " + (status === 413 ? s("shareTooBig").replace("{t}", sizeText(share.max)) : status === 507 ? s("shareNoSpace") : s("shareFailed")));
      break;
    }
  }
  $("shareUp").classList.add("hidden");
  uploading = false;
  await loadShare(); markSeen();
}

function askDelete(x) {
  delId = x.id;
  $("confirmDelName").textContent = x.name != null ? x.name : (x.text || "").slice(0, 80);
  $("confirmDel").classList.remove("hidden");
}
async function doDelete() {
  $("confirmDel").classList.add("hidden");
  try {
    await fetch("/api/share/delete", { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key }, body: JSON.stringify({ id: delId }) });
  } catch (e) { toast("✕ " + s("shareFailed")); }
  await loadShare();
}

// ---------- About (ZangTech, contact, Privacy Policy, Terms of Use) ----------
function openAbout() { $("aboutMain").classList.remove("hidden"); $("aboutLegal").classList.add("hidden"); $("about").classList.remove("hidden"); }
function closeAbout() { $("about").classList.add("hidden"); }
function openLegal(kind) {
  const list = S[kind] || [];
  $("legalTitle").textContent = s(kind === "privacy" ? "privacyTitle" : "termsTitle");
  $("legalBody").innerHTML = list.map((x, i) => {
    const lines = x.split("\n");
    return "<h3>" + (i + 1) + ". " + esc(lines[0]) + "</h3><p>" + esc(lines.slice(1).join("\n")) + "</p>";
  }).join("") + '<p style="margin-top:18px;font-size:13px">' + esc(s("aboutRights")) + "</p>";
  $("aboutMain").classList.add("hidden"); $("aboutLegal").classList.remove("hidden");
  $("about").querySelector(".sheet").scrollTop = 0;
}

// ---------- Dashboard lights ----------
const DASH_COLOR = { red: "#E53935", amber: "#F59E0B", green: "#22A06B", blue: "#2F6BFF", white: "#8A94A6" };
let DASH = null, dashOpen = null;
function lightSvg(d, id, c) {
  if (d.text[id]) {
    const t = d.text[id], fs = t.length <= 2 ? 19 : t.length <= 3 ? 15 : t.length <= 5 ? 11 : 8.5;
    return '<span class="t" style="color:' + c + ';font-size:' + fs + 'px">' + esc(t) + "</span>";
  }
  let g = (d.icons[id] || []).map(p => p.s
    ? '<path d="' + p.d + '" fill="none" stroke="' + c + '" stroke-width="' + p.s + '" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="' + p.d + '" fill="' + c + '"/>').join("");
  if (d.inner[id]) g += '<text x="12" y="13.6" font-size="' + (d.inner[id].length > 2 ? 4.2 : 5) + '" font-weight="800" text-anchor="middle" fill="' + c + '">' + esc(d.inner[id]) + "</text>";
  if (d.caption[id]) g += '<text x="12" y="23" font-size="5" font-weight="800" text-anchor="middle" fill="' + c + '">' + esc(d.caption[id]) + "</text>";
  return '<svg viewBox="0 0 24 24">' + g + "</svg>";
}
function renderDash() {
  if (!DASH) return;
  const q = $("dashQ").value.trim().toLowerCase(), texts = S.dash || {};
  const groups = [["red", "dashRed", "#E53935"], ["amber", "dashAmber", "#F59E0B"], ["info", "dashInfo", "#22A06B"]];
  $("dashList").innerHTML = groups.map(([lvl, label, dot]) => {
    const items = DASH.lights.filter(l => (lvl === "info" ? !["red", "amber"].includes(l.color) : l.color === lvl))
      .filter(l => !q || (texts[l.id] || []).join(" ").toLowerCase().includes(q) || (DASH.text[l.id] || "").toLowerCase().includes(q));
    if (!items.length) return "";
    return '<div class="dash-h"><i style="background:' + dot + '"></i>' + esc(s(label)) + '</div><section class="card flush" style="margin-top:8px">' +
      items.map(l => {
        const c = DASH_COLOR[l.color] || DASH_COLOR.green, t = texts[l.id] || [l.id, "", ""];
        return '<button class="light" data-light="' + l.id + '"><div class="top"><span class="tile" style="background:' + c + '1a">' +
          lightSvg(DASH, l.id, c) + '</span><span class="txt"><b>' + esc(t[0]) + "</b><small>" + esc(t[1]) + "</small></span></div>" +
          (dashOpen === l.id ? '<div class="todo" style="background:' + c + '14"><b style="color:' + c + '">' + esc(s("dashTodo")) + "</b>" + esc(t[2]) + "</div>" : "") +
          "</button>";
      }).join("") + "</section>";
  }).join("");
  $$("[data-light]").forEach(b => b.onclick = () => { dashOpen = dashOpen === b.dataset.light ? null : b.dataset.light; renderDash(); });
}
async function openDash() {
  $("dash").classList.remove("hidden"); $("dashQ").placeholder = s("dashSearch");
  if (!DASH) { try { DASH = await (await fetch("/s/dashlights.json")).json(); } catch (e) { DASH = null; } }
  renderDash(); paintIcons($("dash"));
}

// ---------- start ----------
$$("[data-dash]").forEach(b => b.onclick = openDash);
$("dashBack").onclick = () => $("dash").classList.add("hidden");
$("dashQ").oninput = renderDash;
$$("[data-about]").forEach(b => b.onclick = openAbout);
$("closeAbout").onclick = closeAbout;
$("about").onclick = e => { if (e.target.id === "about") closeAbout(); };
$("legalBack").onclick = () => { $("aboutLegal").classList.add("hidden"); $("aboutMain").classList.remove("hidden"); };
$$("[data-legal]").forEach(b => b.onclick = () => openLegal(b.dataset.legal));
$("pairBtn").onclick = pair;
$("code").addEventListener("keyup", e => { if (e.key === "Enter") pair(); });
$("forget").onclick = forget;
$("toSiri").onclick = () => showTab("siri");
$("tDown").onclick = () => nudge(-1);
$("tUp").onclick = () => nudge(+1);
$$("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("shareSend").onclick = sendShareText;
$("shareFiles").onchange = e => { const f = Array.from(e.target.files || []); e.target.value = ""; sendShareFiles(f); };
$("confirmNo").onclick = () => $("confirmDel").classList.add("hidden");
$("confirmYes").onclick = doDelete;
$("confirmDel").onclick = e => { if (e.target.id === "confirmDel") $("confirmDel").classList.add("hidden"); };
render(); showTab("home");
loadStrings().then(render);
info(); setInterval(info, 5000);
loadShare(); setInterval(loadShare, 5000);
</script>
